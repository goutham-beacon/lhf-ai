<title>LHF AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg:#0c2b3b; --surface:#ffffff; --fg:#0c2b3b; --fg2:#3b5363; --muted:#6f8291; --line:#ccd1d9; --accent:#cb333b; --accent2:#9f282e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface:#12374c; --fg:#ffffff; --fg2:#ccd1d9; --muted:#8fa4b3; --line:#2a5068; --accent:#e2515a; color-scheme: dark; } }
:root[data-theme="dark"] { --surface:#12374c; --fg:#ffffff; --fg2:#ccd1d9; --muted:#8fa4b3; --line:#2a5068; --accent:#e2515a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; display:grid; place-items:center; padding-block:40px; padding-inline:16px; color:var(--fg); }
.card { background:var(--surface); border-radius:12px; padding:32px 28px; width:100%; max-width:420px; border-top:5px solid var(--accent); box-shadow:0 20px 60px rgba(0,0,0,.35); }
.wordmark { display:flex; align-items:baseline; gap:8px; line-height:1; margin-bottom:22px; }
.wordmark .lhf { font-weight:800; font-size:28px; color:var(--accent); }
.wordmark .hn { font-weight:800; font-size:19px; letter-spacing:.02em; }
.wordmark .vr { font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:2px 6px; border-radius:2px; align-self:center; }
h1 { font-size:20px; margin:0 0 6px; font-weight:700; }
p { margin:0 0 18px; color:var(--fg2); font-size:14px; line-height:1.5; }
label { display:block; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
input { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
button { margin-top:14px; width:100%; font:inherit; font-weight:600; font-size:15px; padding:12px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
button:hover { background:var(--accent2); }
button[disabled] { opacity:.6; cursor:default; }
.err { color:var(--accent); font-size:13px; margin-top:10px; min-height:18px; }
.foot { margin-top:18px; font-size:12px; color:var(--muted); }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Opening…';
  try { const html = await unlock(pw.value); try { sessionStorage.setItem('lhf-proto-pw', pw.value); } catch(_){} show(html); }
  catch(_) { err.textContent = 'That password did not work.'; go.disabled = false; go.textContent = 'Open prototype'; pw.select(); }
});
(async () => { let saved = null; try { saved = sessionStorage.getItem('lhf-proto-pw'); } catch(_){} if (saved) { try { show(await unlock(saved)); } catch(_){} } })();
